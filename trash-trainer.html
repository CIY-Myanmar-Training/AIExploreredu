<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trash Island Trainer</title>
<link rel="stylesheet" href="assets/common.css">
<style>
  .stage{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:stretch}
  @media (max-width:820px){.stage{grid-template-columns:1fr}}
  .robot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .robot .face{font-size:110px;line-height:1;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 18px;font-size:19px;text-align:center;max-width:360px}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 18px}
  .item .emo{font-size:130px;line-height:1.05;animation:pop .3s}
  .item .name{font-size:24px;font-weight:700}
  .bins{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bin{border:3px solid var(--ink);border-radius:18px;padding:16px 10px;font-size:22px;font-weight:700;cursor:pointer;color:#fff;
    box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit}
  .bin .ic{font-size:46px;line-height:1}
  .bin.rec{background:var(--green)} .bin.not{background:#6B6B6B}
  .bin:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
  .progress{height:16px;background:#E9E2C7;border-radius:999px;overflow:hidden;border:2px solid var(--ink);margin-bottom:14px}
  .progress i{display:block;height:100%;background:var(--pink);width:0;transition:width .3s}
  .taught{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:44px}
  .taught span{font-size:26px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 6px}
  .taught span.r{background:#D7F3E3} .taught span.n{background:#E3E3E3}
  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:14px 0}
  .res{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:10px;display:flex;gap:10px;align-items:center;opacity:0;transform:scale(.8);transition:.25s}
  .res.in{opacity:1;transform:scale(1)}
  .res .e{font-size:40px}
  .res .d{font-size:15px;line-height:1.35}
  .res.ok{border-color:var(--green);background:#EEFBF3} .res.bad{border-color:var(--red);background:#FDEEEE}
  .score{font-size:30px;font-weight:700;text-align:center;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="mission"><span class="tag" data-t="mission"></span><span data-t="missionText"></span></div>

  <!-- TEACH -->
  <div class="stage" id="teach">
    <div class="panel robot">
      <div class="face">🤖</div>
      <div class="bubble" id="robotSays"></div>
      <div style="width:100%">
        <div class="muted" data-t="taughtLabel" style="font-size:15px"></div>
        <div class="taught" id="taught"></div>
      </div>
    </div>
    <div class="panel">
      <span class="step-label" data-t="step1"></span>
      <div class="progress"><i id="bar"></i></div>
      <div class="item"><div class="emo" id="emo"></div><div class="name" id="name"></div></div>
      <div class="bins">
        <button class="bin rec" data-v="1"><span class="ic">♻️</span><span data-t="rec"></span></button>
        <button class="bin not" data-v="0"><span class="ic">🗑️</span><span data-t="not"></span></button>
      </div>
    </div>
  </div>

  <!-- ROBOT TURN -->
  <div class="panel hidden" id="test">
    <span class="step-label" data-t="step2"></span>
    <h2 data-t="robotTurn"></h2>
    <p data-t="robotTurnSub"></p>
    <div class="center" id="goWrap"><button class="btn pink big" id="go" data-t="goBtn"></button></div>
    <div class="results" id="results"></div>
    <div class="score hidden" id="score"></div>
    <div class="center hidden" id="retryWrap">
      <p data-t="retryHint"></p>
      <button class="btn cyan big" id="retry" data-t="retry"></button>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
const T = {
  title: { en: "Trash Island Trainer", my: "အမှိုက်ကျွန်း စက်ရုပ်သင်တန်း" },
  missionText: { en: "Teach the robot well so it sorts new trash with 80% or more correct.",
                 my: "စက်ရုပ်ကို ကောင်းကောင်းသင်ပေးပါ။ အမှိုက်အသစ်တွေကို ၈၀% နဲ့အထက် မှန်အောင် ခွဲနိုင်ရမယ်။" },
  step1: { en: "STEP 1 · YOU ARE THE TEACHER", my: "အဆင့် ၁ · သင်က ဆရာ" },
  step2: { en: "STEP 2 · ROBOT TEST", my: "အဆင့် ၂ · စက်ရုပ် စာမေးပွဲ" },
  rec: { en: "Recycle", my: "ပြန်သုံးလို့ရ" },
  not: { en: "Not recycle", my: "ပြန်သုံးလို့မရ" },
  taughtLabel: { en: "What you taught me so far:", my: "ကျွန်တော့်ကို သင်ပေးပြီးသမျှ:" },
  robotTurn: { en: "Now the robot sorts trash it has never seen!", my: "အခု စက်ရုပ်က တစ်ခါမှ မမြင်ဖူးတဲ့ အမှိုက်တွေကို ခွဲမယ်!" },
  robotTurnSub: { en: "It can only use what you taught it.", my: "သင်သင်ပေးထားတာကိုပဲ သူသုံးနိုင်တယ်။" },
  goBtn: { en: "▶ Robot, start sorting!", my: "▶ စက်ရုပ်ရေ၊ စခွဲတော့!" },
  retry: { en: "↺ Teach the robot again", my: "↺ စက်ရုပ်ကို ပြန်သင်မယ်" },
  retryHint: { en: "Look at the red mistakes. The robot copied what you taught it. Teach it again more carefully!",
               my: "အနီရောင် အမှားတွေကို ကြည့်ပါ။ စက်ရုပ်က သင်သင်ပေးတာကို လိုက်လုပ်တာပါ။ ပိုဂရုစိုက်ပြီး ပြန်သင်ပေးပါ!" }
};

const TRAIN = [
  ["🍾","glass",{en:"Glass bottle",my:"ဖန်ပုလင်း"}],
  ["🥫","metal",{en:"Food can",my:"သံဘူး"}],
  ["🍌","food",{en:"Banana peel",my:"ငှက်ပျောခွံ"}],
  ["📰","paper",{en:"Newspaper",my:"သတင်းစာ"}],
  ["🧴","plastic",{en:"Plastic bottle",my:"ပလတ်စတစ်ပုလင်း"}],
  ["🍎","food",{en:"Apple core",my:"ပန်းသီးအကြွင်း"}],
  ["📦","paper",{en:"Cardboard box",my:"ကတ်ထူဘူး"}],
  ["🧻","tissue",{en:"Used tissue",my:"သုံးပြီးသား တစ်ရှူး"}],
  ["🫙","glass",{en:"Glass jar",my:"ဖန်ဘူး"}],
  ["🦴","food",{en:"Bone",my:"အရိုး"}],
  ["📄","paper",{en:"Paper sheet",my:"စက္ကူ"}],
  ["🍞","food",{en:"Old bread",my:"ပေါင်မုန့်အကြွင်း"}],
  ["🥤","plastic",{en:"Plastic cup",my:"ပလတ်စတစ်ခွက်"}],
  ["🥚","food",{en:"Eggshell",my:"ကြက်ဥခွံ"}],
  ["🍂","food",{en:"Dry leaves",my:"သစ်ရွက်ခြောက်"}]
];
const TEST = [
  ["🥛","glass",{en:"Drinking glass",my:"ဖန်ခွက်"}],
  ["🍉","food",{en:"Watermelon rind",my:"ဖရဲခွံ"}],
  ["📒","paper",{en:"Old notebook",my:"မှတ်စုစာအုပ်ဟောင်း"}],
  ["🛢️","metal",{en:"Metal drum",my:"သံပုံး"}],
  ["🍗","food",{en:"Chicken bone",my:"ကြက်ရိုး"}],
  ["🪣","plastic",{en:"Plastic bucket",my:"ပလတ်စတစ်ပုံး"}],
  ["✉️","paper",{en:"Envelope",my:"စာအိတ်"}],
  ["🍶","glass",{en:"Small bottle",my:"ပုလင်းငယ်"}],
  ["🌽","food",{en:"Corn cob",my:"ပြောင်းဖူးရိုး"}],
  ["🔩","metal",{en:"Metal bolt",my:"မူလီ"}]
];
const TRUTH = { glass:1, metal:1, paper:1, plastic:1, food:0, tissue:0 };

let idx = 0, labels = [];

function showItem() {
  const it = TRAIN[idx];
  const emo = document.getElementById("emo");
  emo.textContent = it[0];
  emo.style.animation = "none"; emo.offsetHeight; emo.style.animation = "";
  document.getElementById("name").textContent = L(it[2]);
  document.getElementById("bar").style.width = (idx / TRAIN.length * 100) + "%";
  document.getElementById("robotSays").textContent = L({
    en: `Teacher, what is this? Where does it go? (${idx + 1}/${TRAIN.length})`,
    my: `ဆရာ၊ ဒါဘာလဲ? ဘယ်ထဲထည့်ရမလဲ? (${idx + 1}/${TRAIN.length})`
  });
}

function drawTaught() {
  document.getElementById("taught").innerHTML =
    labels.map((v, i) => `<span class="${v ? "r" : "n"}" title="${v ? "♻️" : "🗑️"}">${TRAIN[i][0]}</span>`).join("");
}

document.querySelectorAll(".bin").forEach(b => b.onclick = () => {
  if (idx >= TRAIN.length) return;
  labels.push(+b.dataset.v);
  idx++;
  drawTaught();
  if (idx < TRAIN.length) showItem();
  else {
    document.getElementById("bar").style.width = "100%";
    document.getElementById("robotSays").textContent = L({ en: "Thank you, teacher! I'm ready.", my: "ကျေးဇူးပါ ဆရာ! ကျွန်တော် အဆင်သင့်ပါ။" });
    setTimeout(() => {
      document.getElementById("teach").classList.add("hidden");
      document.getElementById("test").classList.remove("hidden");
    }, 900);
  }
});

/* The robot: find the taught items made of the same stuff, and copy the majority answer. */
function robotGuess(item) {
  const same = TRAIN.map((t, i) => ({ t, v: labels[i] })).filter(o => o.t[1] === item[1]);
  if (!same.length) return { v: 0, like: null };
  const yes = same.filter(o => o.v === 1).length;
  const v = yes * 2 >= same.length ? (yes * 2 === same.length ? same[0].v : 1) : 0;
  const like = same.find(o => o.v === v);
  return { v, like };
}

document.getElementById("go").onclick = async () => {
  document.getElementById("goWrap").classList.add("hidden");
  const box = document.getElementById("results");
  box.innerHTML = "";
  let right = 0;
  for (const item of TEST) {
    const g = robotGuess(item);
    const ok = g.v === TRUTH[item[1]];
    if (ok) right++;
    const binName = g.v ? "♻️ " + t(T, "rec") : "🗑️ " + t(T, "not");
    const why = g.like ? L({ en: `Looks like ${g.like.t[0]}, and you said ${g.v ? "♻️" : "🗑️"}`,
                             my: `${g.like.t[0]} နဲ့တူတယ်၊ သင်က ${g.v ? "♻️" : "🗑️"} လို့ပြောခဲ့တယ်` }) : "";
    const el = document.createElement("div");
    el.className = "res " + (ok ? "ok" : "bad");
    el.innerHTML = `<div class="e">${item[0]}</div><div class="d"><b>${L(item[2])}</b><br>${binName} ${ok ? "✅" : "❌"}<br><span class="muted">${why}</span></div>`;
    box.appendChild(el);
    await sleep(60);
    el.classList.add("in");
    await sleep(550);
  }
  const pct = Math.round(right / TEST.length * 100);
  const sc = document.getElementById("score");
  sc.classList.remove("hidden");
  sc.textContent = L({ en: `Robot score: ${pct}%`, my: `စက်ရုပ် အမှတ်: ${pct}%` });
  if (pct >= 80) {
    await sleep(900);
    showWin("trash", {
      en: "AI learns from the examples people give it. Good teaching made a good robot. If you teach it wrong, it learns wrong too.",
      my: "AI က လူတွေပေးတဲ့ ဥပမာတွေကနေ သင်ယူတယ်။ ကောင်းကောင်းသင်ပေးလို့ စက်ရုပ်ကောင်း ဖြစ်လာတာ။ မှားသင်ရင် သူလည်း မှားသင်ယူမှာပါ။"
    }, "♻️");
  } else {
    document.getElementById("retryWrap").classList.remove("hidden");
  }
};

document.getElementById("retry").onclick = () => {
  idx = 0; labels = [];
  drawTaught();
  ["retryWrap", "score", "test"].forEach(id => document.getElementById(id).classList.add("hidden"));
  document.getElementById("goWrap").classList.remove("hidden");
  document.getElementById("results").innerHTML = "";
  document.getElementById("teach").classList.remove("hidden");
  showItem();
};

buildTopbar(T, "title", () => { if (idx < TRAIN.length) showItem(); });
showItem();
</script>
</body>
</html>
